name: probe
on:
  push:
    branches: [claude/upbeat-faraday-14izad]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --rm ghcr.io/home-assistant/amd64-base:3.22-2025.11.1 sh -c 'apk update >/dev/null; apk info -v jq bash curl; apk policy jq | head -n 4'
