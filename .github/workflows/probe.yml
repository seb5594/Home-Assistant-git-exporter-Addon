name: probe
on:
  push:
    branches: [claude/upbeat-faraday-14izad]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for base in ghcr.io/home-assistant/amd64-base:3.22-2025.11.1 ghcr.io/home-assistant/i386-base:3.22-2025.11.1; do
            echo "== $base"
            docker run --rm --platform linux/386 "$base" true 2>/dev/null || true
          done
          docker run --rm ghcr.io/home-assistant/amd64-base:3.22-2025.11.1 sh -c '
            cat /etc/alpine-release
            apk update >/dev/null
            apk add --simulate git make rsync grep sed python3 py3-yaml findutils coreutils jq | grep -E "Installing (git|make|rsync|grep|sed|python3|py3-yaml|findutils|coreutils|jq) "'
