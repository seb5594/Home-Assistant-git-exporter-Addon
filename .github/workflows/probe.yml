name: probe
on:
  push:
    branches: [claude/upbeat-faraday-14izad]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run --rm ghcr.io/home-assistant/base:3.24-2026.08.0 sh -c '
            apk update >/dev/null
            apk add --simulate git make rsync grep sed python3 py3-yaml findutils | grep -E "Installing (git|make|rsync|grep|sed|python3|py3-yaml|findutils) "
            cat /etc/alpine-release'
